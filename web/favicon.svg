<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Octagonal frustum silhouette in side profile + top-down outline.
       Side profile (trapezoid, top): the recurring shape across the project.
       Top-down outline (octagon, bottom): the 8-fold symmetry. -->
  <rect width="64" height="64" rx="8" fill="#2b2b2b"/>
  <!-- Trapezoid (side profile of an octagonal frustum) -->
  <polygon points="22,16 42,16 50,30 14,30" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Octagon (top-down view of the same frustum) -->
  <polygon points="26,38 38,38 46,46 46,54 38,62 26,62 18,54 18,46"
           fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linejoin="round"
           transform="translate(0,-4)"/>
</svg>
